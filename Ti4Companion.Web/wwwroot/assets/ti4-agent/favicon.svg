<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark space background -->
  <rect width="32" height="32" rx="4" fill="#050510"/>
  <!-- Outer hexagon (TI4 iconic tile shape) in gold -->
  <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Inner hexagon accent in blue -->
  <polygon points="16,7 23,11 23,19 16,23 9,19 9,11" fill="#0a0a1a" stroke="#4a90d9" stroke-width="1"/>
  <!-- Central planet/star circle -->
  <circle cx="16" cy="15" r="3.5" fill="#4a90d9" opacity="0.9"/>
  <!-- Star sparkle lines -->
  <line x1="16" y1="10" x2="16" y2="12" stroke="#d4af37" stroke-width="0.8" opacity="0.7"/>
  <line x1="16" y1="18" x2="16" y2="20" stroke="#d4af37" stroke-width="0.8" opacity="0.7"/>
  <line x1="11" y1="15" x2="13" y2="15" stroke="#d4af37" stroke-width="0.8" opacity="0.7"/>
  <line x1="19" y1="15" x2="21" y2="15" stroke="#d4af37" stroke-width="0.8" opacity="0.7"/>
</svg>
